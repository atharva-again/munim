<!doctype html>
<html
  lang="en"
  class="min-w-80 bg-canvas font-sans font-normal text-fg antialiased scheme-light dark:scheme-dark dark:[--color-canvas:#000000] dark:[--color-fg:#ffffff] selection:bg-fg selection:text-canvas [&_h1]:font-normal [&_h2]:font-normal [&_h3]:font-normal [&_h4]:font-normal [&_strong]:font-normal [&_b]:font-normal [&_button:enabled]:cursor-pointer [&_a[href]]:cursor-pointer [&_select:enabled]:cursor-pointer [&_summary]:cursor-pointer [&_:disabled]:cursor-not-allowed [&_:disabled]:opacity-40 [&_[aria-disabled=true]]:cursor-not-allowed [&_[aria-disabled=true]]:opacity-40 [&_:focus-visible:not(.outline-none)]:outline-2 [&_:focus-visible:not(.outline-none)]:outline-offset-3 [&_:focus-visible:not(.outline-none)]:outline-fg"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Keep the shop moving. Speak a sale, purchase, or payment in Hindi or English. Munim keeps the record and what’s still due."
    />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>munim</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("munim-theme");
        document.documentElement.dataset.theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body class="text-sm">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
